services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/mic
      TZ: Asia/Jakarta
    volumes:
      # Sesi login WhatsApp: tetap ada walau container dibuat ulang (tidak perlu pairing lagi).
      - wa-auth:/app/data/wa-auth
    depends_on:
      mongo:
        condition: service_healthy
    # Mode B (Hermes Agent di host): pakai LLM_BASE_URL=http://host.docker.internal:8643/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  wa-auth:
